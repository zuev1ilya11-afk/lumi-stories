name: Deploy LUMI Prototype to GitHub Pages

on:
  push:
    branches:
      - feat/prototype-0.1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lumi-prototype-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: lumi-prototype-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build Pages artifact
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke deployed frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $page_url"
          curl --fail --silent --show-error --location "$page_url" --output /tmp/lumi-page.html
          grep -F 'id="root"' /tmp/lumi-page.html
          grep -F '/lumi-stories/assets/' /tmp/lumi-page.html

          health_url="https://ctgvfjubgxdmhbmhubes.supabase.co/functions/v1/lumi-api/health"
          curl --fail --silent --show-error "$health_url" --output /tmp/lumi-health.json
          grep -F '"telegramConfigured":true' /tmp/lumi-health.json
          grep -F '"databaseConfigured":true' /tmp/lumi-health.json

          bootstrap_url="https://ctgvfjubgxdmhbmhubes.supabase.co/functions/v1/lumi-api/bootstrap"
          status="$(curl --silent --output /tmp/lumi-bootstrap.json --write-out '%{http_code}' --request POST "$bootstrap_url")"
          test "$status" = "401"
